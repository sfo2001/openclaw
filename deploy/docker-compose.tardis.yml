# OpenClaw Tardis lean deploy — no vault sidecar, no autorouter.
#
# Replaces deploy/docker-compose.vault.yml. Keeps the read-only / cap-drop
# hardening from feat/local-hardening; drops the vault internal network and
# the autorouter host alias. API keys live in agent auth-profiles.json
# (per-agent) or as plain config strings — your choice when migrating.
#
# STT (feat/tardis-whisper): the Whisper service runs on **matrix** at
# matrix:9000 (provisioned by ~/devel/matrix-server-toolkit `matrix-whisper`).
# OpenClaw reaches it cross-host via the existing `matrix:192.168.178.159`
# extra_hosts entry, with Bearer auth from `MATRIX_WHISPER_API_KEY` in .env.
# No tardis-side Whisper container.  See README.tardis-whisper.md.
#
# Usage:
#   docker compose -f docker-compose.tardis.yml up -d
#
# Build:  the image localhost:5000/openclaw-hardened:latest is built from
# branch deploy/tardis-lean (origin/main + 5 hardening cherry-picks).

services:
  openclaw-gateway:
    image: localhost:5000/openclaw-hardened:lean
    container_name: OpenClaw
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    env_file: .env
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_CONFIG_PATH: /config/openclaw.json
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      # Force IPv4 — Telegram's api.telegram.org currently returns IPv6 only,
      # but the bridge network is IPv4. Without this Node tries IPv6 first and
      # the telegram plugin hits 188s polling stalls.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      - /mnt/user/appdata/openclaw/home:/home/node
      - /mnt/remotes/192.168.178.71_openclaw:/home/node/clawd
      - /mnt/user/appdata/openclaw/docs:/home/node/docs:ro
      - /mnt/user/appdata/openclaw/config:/config
      # Docker socket intentionally absent — sandbox.mode is "off" in config.
      # Re-add via tecnativa/docker-socket-proxy if you turn sandbox back on.
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Matrix server hosts Ollama at :11434
      - "matrix:192.168.178.159"
      # SearXNG container on host bridge (port 8181)
      - "searxng:host-gateway"
      # Gitea on br0 ipvlan
      - "gitea:192.168.178.3"
      # Pin Telegram API to IPv4 — bridge net is v4-only, but DNS returns
      # IPv6 first which undici (used by the telegram plugin) cannot fall
      # back from, causing 188s polling stalls.
      - "api.telegram.org:149.154.166.110"
    ports:
      - "18790:18789"
    init: true
    restart: unless-stopped
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
