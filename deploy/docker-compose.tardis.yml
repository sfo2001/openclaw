# OpenClaw Tardis lean deploy — no vault sidecar, no autorouter container.
#
# Replaces deploy/docker-compose.vault.yml. Keeps the read-only / cap-drop
# hardening from feat/local-hardening; drops the vault internal network and
# the autorouter sidecar (autorouter now runs as a separate container on
# tardis host:4000, reached via host.docker.internal).
#
# STT (feat/tardis-whisper rework): no tardis-side Whisper container. The
# Whisper service is reached at host.docker.internal:9100 from the OpenClaw
# container (host-level forwarder configured outside this compose file).
# Earlier iterations ran a sibling `whisper` sidecar locally — dropped
# because routing via host.docker.internal is what the live deployment uses.
#
# Usage:
#   docker compose -f docker-compose.tardis.yml up -d
#
# Build:  the image localhost:5000/openclaw-hardened:lean is built from
# branch deploy/tardis-lean-v2026.5.12 (v2026.5.12 + 3 hardening cherry-picks
# + 5 merges from feat/* branches + plugin wiring).

services:
  openclaw-gateway:
    image: localhost:5000/openclaw-hardened:lean
    container_name: OpenClaw
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    env_file: .env
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_CONFIG_PATH: /config/openclaw.json
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_LOG_LEVEL: debug
      # Force IPv4 — Telegram's api.telegram.org currently returns IPv6 only,
      # but the bridge network is IPv4. Without this Node tries IPv6 first and
      # the telegram plugin hits 188s polling stalls.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      - /mnt/user/appdata/openclaw/home:/home/node
      - /mnt/remotes/192.168.178.71_openclaw:/home/node/clawd
      - /mnt/user/appdata/openclaw/docs:/home/node/docs:ro
      - /mnt/user/appdata/openclaw/config:/config
      # Out-of-tree workspace plugin: caps tool calls per run. Replaces the
      # in-tree fix/heartbeat patch that was dropped at v2026.5.12.
      # Source synced from gallifrey to tardis appdata at deploy time.
      - /mnt/user/appdata/openclaw-plugin-toolcall-cap:/home/node/openclaw-plugin-toolcall-cap:ro
      # Docker socket intentionally absent — sandbox.mode is "off" in config.
      # Re-add via tecnativa/docker-socket-proxy if you turn sandbox back on.
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Matrix server hosts Ollama at :11434
      - "matrix:192.168.178.159"
      # SearXNG container on host bridge (port 8181)
      - "searxng:host-gateway"
      # Gitea on br0 ipvlan
      - "gitea:192.168.178.3"
      # Pin Telegram API to IPv4 — bridge net is v4-only, but DNS returns
      # IPv6 first which undici (used by the telegram plugin) cannot fall
      # back from, causing 188s polling stalls.
      - "api.telegram.org:149.154.166.110"
    ports:
      - "18790:18789"
    init: true
    restart: unless-stopped
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
